services:
  postgres:
    image: postgres:17-alpine
    container_name: task-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - taskflow-network

  api-1:
    build:
      context: .
      dockerfile: dockerfile

    container_name: task-api-1

    environment:
      INSTANCE_NAME: api-1
      DATABASE_URL: ${DATABASE_URL}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - taskflow-network

  api-2:
    build:
      context: .
      dockerfile: dockerfile

    container_name: task-api-2

    environment:
      INSTANCE_NAME: api-2
      DATABASE_URL: ${DATABASE_URL}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - taskflow-network

  nginx:
    image: nginx:alpine
    container_name: task-load-balancer

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - taskflow-network
  adminer:
    image: adminer
    container_name: task-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - taskflow-network
    restart: unless-stopped
    
networks:
  taskflow-network:
    driver: bridge

volumes:
  postgres_data: